name: Black Current Founder Portrait Fix

on:
  push:
    branches:
      - black-current-netlify-check-temp
    paths:
      - .github/workflows/bcm-founder-fix.yml

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout temporary deploy branch
        uses: actions/checkout@v4
        with:
          ref: black-current-netlify-check-temp
          fetch-depth: 0

      - name: Create ephemeral deployment key
        shell: bash
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/bcm-founder-private.pem >/dev/null 2>&1
          openssl rsa -pubout -in /tmp/bcm-founder-private.pem -out bcm-founder-public.pem >/dev/null 2>&1
          git config user.name "black-current-deploy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add bcm-founder-public.pem
          git commit -m "Publish Black Current founder-fix deploy key"
          git push origin HEAD:black-current-netlify-check-temp

      - name: Build compact-founder production patch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site/assets site/thanks
          TS="$(date +%s)"
          curl -fsSL "https://blackcurrentmedia.com/?founderfix2=$TS" -o site/index.html
          curl -fsSL "https://blackcurrentmedia.com/thanks/?founderfix2=$TS" -o site/thanks/index.html
          curl -fsSL "https://blackcurrentmedia.com/assets/bankful-sales-report.png?founderfix2=$TS" -o site/assets/bankful-sales-report.png
          curl -fsSL "https://blackcurrentmedia.com/assets/ben-horch-headshot.jpg?founderfix2=$TS" -o site/assets/ben-horch-headshot.jpg
          curl -fsSL "https://blackcurrentmedia.com/black-current-favicon.svg?v=4&founderfix2=$TS" -o site/black-current-favicon.svg
          cat > site/_headers <<'HEADERS'
          /*
            X-Frame-Options: DENY
            X-Content-Type-Options: nosniff
            Referrer-Policy: strict-origin-when-cross-origin
            Permissions-Policy: camera=(), microphone=(), geolocation=()
          /black-current-favicon.svg
            Cache-Control: public, max-age=604800
          /assets/*
            Cache-Control: public, max-age=604800
          HEADERS
          python - <<'PY'
          from pathlib import Path
          p = Path('site/index.html')
          s = p.read_text()
          override = '''
          <style id="founder-size-fix-v2">
            .founder{padding:56px 0!important}
            .founder-grid{grid-template-columns:180px minmax(0,1fr)!important;gap:40px!important;align-items:center!important}
            .portrait{width:180px!important;max-width:180px!important;height:220px!important;overflow:hidden!important;align-self:center!important;justify-self:start!important;margin:0!important}
            .portrait img{width:100%!important;height:100%!important;max-width:none!important;aspect-ratio:auto!important;object-fit:cover!important;object-position:center 28%!important}
            .portrait:after{left:8px!important;bottom:8px!important;padding:5px 6px!important;font-size:7px!important}
            @media(max-width:980px){
              .founder-grid{grid-template-columns:160px minmax(0,1fr)!important;gap:30px!important}
              .portrait{width:160px!important;max-width:160px!important;height:195px!important;margin:0!important}
            }
            @media(max-width:680px){
              .founder-grid{grid-template-columns:1fr!important;gap:22px!important}
              .portrait{width:140px!important;max-width:140px!important;height:170px!important;margin:0 auto!important}
              .founder{padding:46px 0!important}
            }
          </style>
          '''
          if 'founder-size-fix-v2' in s:
              raise SystemExit('Founder v2 override already present')
          s = s.replace('</head>', override + '</head>', 1)
          p.write_text(s)
          PY
          grep -q 'grid-template-columns:180px minmax(0,1fr)' site/index.html
          grep -q 'height:220px!important' site/index.html
          grep -q 'width:140px!important' site/index.html

      - name: Wait for encrypted one-time Netlify authorization
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/bcm-founder-key.b64 /tmp/bcm-founder-data.b64
          for i in $(seq 1 100); do
            git fetch -q origin black-current-netlify-check-temp
            if git show origin/black-current-netlify-check-temp:bcm-founder-key.b64 > /tmp/bcm-founder-key.b64 2>/dev/null && git show origin/black-current-netlify-check-temp:bcm-founder-data.b64 > /tmp/bcm-founder-data.b64 2>/dev/null; then
              break
            fi
            sleep 3
          done
          test -s /tmp/bcm-founder-key.b64
          test -s /tmp/bcm-founder-data.b64

      - name: Deploy compact founder patch to Black Current production
        shell: bash
        env:
          NETLIFY_SITE_ID: 6f65cb2a-0db4-4f88-9065-36ceca609639
        run: |
          set -euo pipefail
          base64 -d /tmp/bcm-founder-key.b64 > /tmp/bcm-founder-key.enc
          openssl pkeyutl -decrypt -inkey /tmp/bcm-founder-private.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in /tmp/bcm-founder-key.enc > /tmp/bcm-founder-aes-key
          base64 -d /tmp/bcm-founder-data.b64 > /tmp/bcm-founder-proxy.enc
          openssl enc -d -aes-256-cbc -pbkdf2 -pass file:/tmp/bcm-founder-aes-key -in /tmp/bcm-founder-proxy.enc > /tmp/bcm-founder-proxy.txt
          PROXY="$(cat /tmp/bcm-founder-proxy.txt)"
          case "$PROXY" in
            https://netlify-mcp.netlify.app/proxy/*) ;;
            *) echo "Invalid deploy authorization"; exit 3 ;;
          esac
          cd site
          npx -y @netlify/mcp@latest --site-id "$NETLIFY_SITE_ID" --proxy-path "$PROXY" --no-wait
