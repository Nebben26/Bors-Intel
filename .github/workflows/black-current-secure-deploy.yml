name: Black Current Secure Netlify Deploy

on:
  push:
    branches:
      - black-current-netlify-check-temp
    paths:
      - .github/workflows/black-current-secure-deploy.yml

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout temporary deploy branch
        uses: actions/checkout@v4
        with:
          ref: black-current-netlify-check-temp
          fetch-depth: 0

      - name: Create ephemeral deployment key
        shell: bash
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/bcm-deploy-private.pem >/dev/null 2>&1
          openssl rsa -pubout -in /tmp/bcm-deploy-private.pem -out black-current-deploy-public.pem >/dev/null 2>&1
          git config user.name "black-current-deploy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add black-current-deploy-public.pem
          git commit -m "Publish ephemeral Black Current deploy key"
          git push origin HEAD:black-current-netlify-check-temp

      - name: Prepare Black Current production site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          cat > site/index.html <<'HTML'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Black Current Media | U.S. Media Partner for Global Organizations</title><meta name="description" content="Black Current Media builds American audiences, media operations, and owned distribution for organizations outside the United States."><style>
