plate-columns:.82fr 1.18fr;gap:62px;margin-bottom:38px}.head h2,.founder h2{font-size:clamp(31px,4vw,48px);line-height:1.04;letter-spacing:-.04em;margin:0}.intro{font-size:17px;color:var(--muted);margin:0}.two{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line)}.offer{padding:32px;min-height:315px}.offer+.offer{border-left:1px solid var(--line)}.num{font-size:10px;letter-spacing:.13em;color:var(--blue);font-weight:800}.offer h3{font-size:27px;margin:20px 0 10px;letter-spacing:-.03em}.offer p{color:var(--muted)}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{padding:6px 8px;border:1px solid var(--line);background:var(--soft);font-size:11px}.proof{background:var(--navy);color:#fff}.proof .intro{color:#c3cfda}.proof .k{color:#91bde8}.stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid #344556}.stat{padding:31px}.stat+.stat{border-left:1px solid #344556}.stat strong{font-size:47px;line-height:1;display:block;letter-spacing:-.05em}.stat span{color:#b8c6d3;font-size:13px}.note{font-size:11px;color:#93a3b2;margin-top:17px}.steps{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line)}.step{padding:25px}.step+.step{border-left:1px solid var(--line)}.step strong{display:block;font-size:19px;margin:10px 0 7px}.step p{font-size:13px;color:var(--muted);margin:0}.agency{background:var(--soft)}.agency-grid,.founder,.contact-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:62px}.list{border-top:1px solid #cdd3d9}.list div{padding:12px 0;border-bottom:1px solid #cdd3d9;display:flex;justify-content:space-between;font-size:13px}.list span:last-child{color:var(--muted)}.card{border:1px solid var(--line);padding:28px}.card strong{font-size:23px}.card p{color:var(--muted)}.contact{background:#090b0e;color:#fff}.contact .intro{color:#b6bec8}.form{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:grid;gap:6px}.full{grid-column:1/-1}.field label{font-size:11px;color:#c6ccd3}.field input,.field select,.field textarea{background:#15191e;border:1px solid #343b43;color:#fff;padding:12px;font:inherit;width:100%}.field textarea{min-height:120px}.form button{grid-column:1/-1;justify-self:start;background:#fff;color:#111}.fine{grid-column:1/-1;color:#808995;font-size:10px}.foot{padding:28px 0;background:#050607;color:#979fa8;font-size:11px}.foot .wrap{display:flex;justify-content:space-between;align-items:center;gap:25px}.foot .brand{color:#f4f1e9}@media(max-width:880px){.links{display:none}.hero-grid,.head,.two,.stats,.steps,.agency-grid,.founder,.contact-grid{grid-template-columns:1fr}.offer+.offer,.stat+.stat,.step+.step{border-left:0;border-top:1px solid var(--line)}.hero{padding-top:55px}.head{gap:17px}.sec{padding:58px 0}}@media(max-width:560px){.wrap{width:calc(100% - 28px)}.nav .btn{font-size:11px;padding:9px 11px;margin-left:auto}.brand{font-size:20px}h1{font-size:44px}.lead{font-size:16px}.form{grid-template-columns:1fr}.row,.list div{display:block}.row span,.list span{display:block!important;text-align:left!important;margin-top:3px}.foot .wrap{flex-direction:column;align-items:flex-start}}
          </style></head><body><div class="bar"><div class="wrap">Black Current Media · United States · Working internationally</div></div><header class="nav"><div class="wrap"><a class="brand" href="#top"><svg class="mark" viewBox="0 0 72 52"><g fill="currentColor"><rect x="4" y="5" width="64" height="9"/><path d="M4 21h23c7 0 11-7 18-7h23v9H46c-7 0-11 7-19 7H4z"/><rect x="4" y="38" width="64" height="9"/></g></svg>BlackCurrent</a><nav class="links"><a href="#work">Work</a><a href="#evidence">Evidence</a><a href="#model">Model</a><a href="#about">About</a></nav><a class="btn dark" href="#contact">Discuss a Project</a></div></header><main id="top"><section class="hero"><div class="wrap hero-grid"><div><div class="k">American media capability for global organizations</div><h1>Build an American audience you own.</h1><p class="lead">Black Current Media is a U.S.-based media and audience operator for organizations outside the United States. We can join an existing engagement or build the media operation from the ground up.</p><div class="actions"><a class="btn dark" href="#contact">Discuss a Project</a><a class="btn" href="#evidence">See the Evidence</a></div></div><aside class="panel"><div class="k">What Black Current can own</div><h2>The American side of the engagement.</h2><p>For agencies, companies, media groups, investment organizations, and institutions that need U.S.-native execution.</p><div class="rows"><div class="row"><b>Audience</b><span>Strategy · Growth · Distribution</span></div><div class="row"><b>Content</b><span>Programming · Short form · Editorial</span></div><div class="row"><b>Owned channels</b><span>Web · Email · Subscriber systems</span></div><div class="row"><b>Operations</b><span>Launch · Measurement · Optimization</span></div></div></aside></div></section><section class="sec" id="work"><div class="wrap"><div class="head"><div><div class="k">Two ways to hire us</div><h2>Start small. Scale into the asset.</h2></div><p class="intro">Black Current is structured to be useful before a large institutional mandate exists. Bring us into active work, or use us to design and launch a new American-facing media property.</p></div><div class="two"><article class="offer"><div class="num">01 · FASTEST ENGAGEMENT</div><h3>U.S. Media Partner</h3><p>For agencies and international organizations that need an American operator inside existing client work. We can work white-label, as a subcontractor, embedded, or client-facing.</p><div class="chips"><span class="chip">Audience strategy</span><span class="chip">Organic growth</span><span class="chip">Content systems</span><span class="chip">Short-form</span><span class="chip">Web & conversion</span><span class="chip">Email & lifecycle</span><span class="chip">U.S. localization</span></div></article><article class="offer"><div class="num">02 · OWNED MEDIA</div><h3>Media Ventures</h3><p>For organizations that want to own the audience rather than continually rent access to it. We design the concept, operating model, programming, distribution, infrastructure, launch, and growth system.</p><div class="chips"><span class="chip">Audience Asset Thesis</span><span class="chip">Blueprint</span><span class="chip">Funded build</span><span class="chip">Ongoing operation</span><span class="chip">Commercialization</span></div></article></div></div></section><section class="sec proof" id="evidence"><div class="wrap"><div class="head"><div><div class="k">Founder operating evidence</div><h2>Built from zero.</h2></div><p class="intro">The relevant proof is evidence that the underlying operating system has already produced audience, distribution, and revenue.</p></div><div class="stats"><div class="stat"><strong>$775K+</strong><span>Receipt-backed lifetime digital sales</span></div><div class="stat"><strong>62K+</strong><span>Organic Facebook audience built from zero</span></div><div class="stat"><strong>10M+</strong><span>Historical organic video views</span></div></div><p class="note">These figures describe founder Ben Horch's prior operating record, including Bors Finance. They are not presented as Black Current client results. Supporting evidence can be provided during diligence.</p></div></section><section class="sec" id="model"><div class="wrap"><div class="head"><div><div class="k">The venture model</div><h2>Blueprint. Build. Operate. Own.</h2></div><p class="intro">The engagement can stop after strategy or continue into a funded operating relationship. Team capacity expands with the mandate rather than being carried as unnecessary overhead beforehand.</p></div><div class="steps"><div class="step"><div class="num">01</div><strong>Thesis</strong><p>Define the audience opportunity, category white space, media concept, and rationale.</p></div><div class="step"><div class="num">02</div><strong>Blueprint</strong><p>Build the brand, programming architecture, economics, team, distribution, and launch plan.</p></div><div class="step"><div class="num">03</div><strong>Build</strong><p>Activate the production unit and launch the owned media operation with funded scope.</p></div><div class="step"><div class="num">04</div><strong>Operate</strong><p>Run programming, distribution, audience growth, measurement, and iteration.</p></div></div></div></section><section class="sec agency"><div class="wrap agency-grid"><div><div class="k">For agencies outside the U.S.</div><h2>Your American media capability.</h2><p class="intro">Black Current can sit behind your agency rather than compete with it. When a client needs U.S.-native content, audience development, growth, web, email, or media operations, we can become the American specialist attached to the engagement.</p><div class="actions" style="margin-top:25px"><a class="btn dark" href="#contact">Discuss an Agency Partnership</a></div></div><div class="list"><div><b>White-label</b><span>Your agency remains the lead</span></div><div><b>Subcontract</b><span>Defined U.S. scope</span></div><div><b>Embedded</b><span>Work inside the client team</span></div><div><b>Client-facing</b><span>Specialist capability presented jointly</span></div><div><b>Expandable</b><span>Project work can grow into media ventures</span></div></div></div></section><section class="sec" id="about"><div class="wrap founder"><div><div class="k">Founder-led</div><h2>Lean before it needs to be large.</h2></div><div class="card"><strong>Ben Horch · Founder / Operator</strong><p>Black Current is built around direct operating experience across audience growth, organic content, websites, conversion, lifecycle email, subscriber infrastructure, recurring revenue, analytics, and workflow systems.</p><p>For larger engagements, Black Current assembles the specialist operating unit required by the scope rather than maintaining an oversized fixed agency structure.</p></div></div></section><section class="sec contact" id="contact"><div class="wrap contact-grid"><div><div class="k">Start here</div><h2>What are you trying to build in America?</h2><p class="intro">Black Current can begin with a narrow specialist assignment, an audience thesis, or a larger media-venture discussion.</p></div><form class="form" name="project-inquiry" method="POST" data-netlify="true" netlify-honeypot="bot-field"><input type="hidden" name="form-name" value="project-inquiry"><p style="display:none"><label>Do not fill <input name="bot-field"></label></p><div class="field"><label>Name</label><input name="name" required></div><div class="field"><label>Work email</label><input type="email" name="email" required></div><div class="field"><label>Organization</label><input name="organization" required></div><div class="field"><label>Country</label><input name="country" required></div><div class="field"><label>Engagement</label><select name="engagement"><option>U.S. media / growth partner</option><option>Agency subcontract / white-label</option><option>Audience Asset Thesis / Blueprint</option><option>Funded media build</option><option>Ongoing media operation</option></select></div><div class="field"><label>Timeline</label><select name="timeline"><option>Immediately</option><option>Within 30 days</option><option>Within 90 days</option><option>Exploring</option></select></div><div class="field full"><label>What are you trying to build or solve?</label><textarea name="project" required></textarea></div><button class="btn" type="submit">Send Project Inquiry</button><div class="fine">Commercial media work only. Government and state-linked engagements are subject to applicable U.S. legal and disclosure review. Black Current does not provide covert political influence services.</div></form></div></section></main><footer class="foot"><div class="wrap"><span class="brand"><svg class="mark" viewBox="0 0 72 52"><g fill="currentColor"><rect x="4" y="5" width="64" height="9"/><path d="M4 21h23c7 0 11-7 18-7h23v9H46c-7 0-11 7-19 7H4z"/><rect x="4" y="38" width="64" height="9"/></g></svg>BlackCurrent</span><span>© 2026 Black Current Media · U.S. media and audience capability for global organizations.</span></div></footer></body></html>
          HTML
          cat > site/_headers <<'HEADERS'
          /*
            X-Frame-Options: DENY
            X-Content-Type-Options: nosniff
            Referrer-Policy: strict-origin-when-cross-origin
            Permissions-Policy: camera=(), microphone=(), geolocation=()
          HEADERS
          test -s site/index.html
          grep -q "Build an American audience you own" site/index.html
          grep -q 'data-netlify="true"' site/index.html

      - name: Wait for encrypted one-time Netlify authorization
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/bcm-key.b64 /tmp/bcm-data.b64
          for i in $(seq 1 80); do
            git fetch -q origin black-current-netlify-check-temp
            if git show origin/black-current-netlify-check-temp:black-current-deploy-key.b64 > /tmp/bcm-key.b64 2>/dev/null && git show origin/black-current-netlify-check-temp:black-current-deploy-data.b64 > /tmp/bcm-data.b64 2>/dev/null; then
              break
            fi
            sleep 3
          done
          test -s /tmp/bcm-key.b64
          test -s /tmp/bcm-data.b64

      - name: Decrypt authorization and deploy Black Current
        shell: bash
        env:
          NETLIFY_SITE_ID: 6f65cb2a-0db4-4f88-9065-36ceca609639
        run: |
          set -euo pipefail
          base64 -d /tmp/bcm-key.b64 > /tmp/bcm-key.enc
          openssl pkeyutl -decrypt -inkey /tmp/bcm-deploy-private.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in /tmp/bcm-key.enc > /tmp/bcm-aes-key
          base64 -d /tmp/bcm-data.b64 > /tmp/bcm-proxy.enc
          openssl enc -d -aes-256-cbc -pbkdf2 -pass file:/tmp/bcm-aes-key -in /tmp/bcm-proxy.enc > /tmp/bcm-proxy.txt
          PROXY="$(cat /tmp/bcm-proxy.txt)"
          case "$PROXY" in
            https://netlify-mcp.netlify.app/proxy/*) ;;
            *) echo "Invalid deploy authorization"; exit 3 ;;
          esac
          npx -y @netlify/mcp@latest --site-id "$NETLIFY_SITE_ID" --proxy-path "$PROXY" --no-wait
          rm -f /tmp/bcm-key.enc /tmp/bcm-aes-key /tmp/bcm-proxy.enc /tmp/bcm-proxy.txt /tmp/bcm-deploy-private.pem
