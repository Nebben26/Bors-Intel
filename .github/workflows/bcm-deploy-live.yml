name: Black Current Live Deploy

on:
  push:
    branches:
      - black-current-netlify-check-temp
    paths:
      - .github/workflows/bcm-deploy-live.yml

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deploy branch
        uses: actions/checkout@v4
        with:
          ref: black-current-netlify-check-temp
          fetch-depth: 0

      - name: Create one-time encryption key
        shell: bash
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/bcm-live-private.pem >/dev/null 2>&1
          openssl rsa -pubout -in /tmp/bcm-live-private.pem -out bcm-live-public.pem >/dev/null 2>&1
          git config user.name "black-current-deploy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add bcm-live-public.pem
          git commit -m "Publish one-time Black Current live key"
          git push origin HEAD:black-current-netlify-check-temp

      - name: Recover approved Black Current build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/black-current-secure-deploy.yml').read_text()
          start = "          cat > site/index.html <<'HTML'\n"
          end = "\n          HTML\n"
          if start not in src:
              raise SystemExit('Approved build marker not found')
          html = src.split(start, 1)[1].split(end, 1)[0]
          html = '\n'.join(line[10:] if line.startswith('          ') else line for line in html.splitlines()) + '\n'
          Path('site/index.html').write_text(html)
          PY
          cat > site/_headers <<'HEADERS'
          /*
            X-Frame-Options: DENY
            X-Content-Type-Options: nosniff
            Referrer-Policy: strict-origin-when-cross-origin
            Permissions-Policy: camera=(), microphone=(), geolocation=()
          HEADERS
          test -s site/index.html
          grep -q "Build an American audience you own" site/index.html
          grep -q 'data-netlify="true"' site/index.html

      - name: Wait for encrypted Netlify authorization
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/bcm-live-key.b64 /tmp/bcm-live-data.b64
          for i in $(seq 1 100); do
            git fetch -q origin black-current-netlify-check-temp
            if git show origin/black-current-netlify-check-temp:bcm-live-key.b64 > /tmp/bcm-live-key.b64 2>/dev/null && git show origin/black-current-netlify-check-temp:bcm-live-data.b64 > /tmp/bcm-live-data.b64 2>/dev/null; then
              break
            fi
            sleep 3
          done
          test -s /tmp/bcm-live-key.b64
          test -s /tmp/bcm-live-data.b64

      - name: Deploy to Black Current production
        shell: bash
        env:
          NETLIFY_SITE_ID: 6f65cb2a-0db4-4f88-9065-36ceca609639
        run: |
          set -euo pipefail
          base64 -d /tmp/bcm-live-key.b64 > /tmp/bcm-live-key.enc
          openssl pkeyutl -decrypt -inkey /tmp/bcm-live-private.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in /tmp/bcm-live-key.enc > /tmp/bcm-live-aes-key
          base64 -d /tmp/bcm-live-data.b64 > /tmp/bcm-live-proxy.enc
          openssl enc -d -aes-256-cbc -pbkdf2 -pass file:/tmp/bcm-live-aes-key -in /tmp/bcm-live-proxy.enc > /tmp/bcm-live-proxy.txt
          PROXY="$(cat /tmp/bcm-live-proxy.txt)"
          case "$PROXY" in
            https://netlify-mcp.netlify.app/proxy/*) ;;
            *) echo "Invalid deploy authorization"; exit 3 ;;
          esac
          npx -y @netlify/mcp@latest --site-id "$NETLIFY_SITE_ID" --proxy-path "$PROXY" --no-wait
          rm -f /tmp/bcm-live-key.enc /tmp/bcm-live-aes-key /tmp/bcm-live-proxy.enc /tmp/bcm-live-proxy.txt /tmp/bcm-live-private.pem
