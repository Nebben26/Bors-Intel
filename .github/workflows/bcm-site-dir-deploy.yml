              <section class="sec" id="work"><div class="wrap"><div class="head"><div><p class="eyebrow">Three ways to engage</p><h2>Start with the smallest useful scope.</h2></div><p class="intro">Black Current is deliberately structured so a buyer does not need to begin with a giant mandate. Start with a defined American operating role, a strategy engagement, or a funded media build.</p></div><div class="engagements"><article class="engagement"><div class="num">01 · FASTEST ENGAGEMENT</div><h3>U.S. Media Partner</h3><p>For agencies and international organizations that need an American operator inside active work. White-label, subcontracted, embedded, or client-facing.</p><div class="chips"><span class="chip">Content strategy</span><span class="chip">Organic growth</span><span class="chip">Short-form</span><span class="chip">Web & conversion</span><span class="chip">Email & lifecycle</span><span class="chip">U.S. localization</span></div><a class="btn dark" href="#contact" data-engagement="Agency subcontract / white-label">Discuss a partnership</a></article><article class="engagement"><div class="num">02 · STRATEGY ENTRY</div><h3>Audience Asset Thesis</h3><p>A focused engagement defining the U.S. audience opportunity, category white space, media concept, programming, distribution, economics, and next build.</p><div class="chips"><span class="chip">Opportunity map</span><span class="chip">Media concept</span><span class="chip">Programming slate</span><span class="chip">Distribution model</span><span class="chip">Operating thesis</span></div><a class="btn" href="#contact" data-engagement="Audience Asset Thesis / Blueprint">Request a thesis</a></article><article class="engagement"><div class="num">03 · OWNED MEDIA</div><h3>Build + Operate</h3><p>For organizations ready to own the asset. Black Current assembles the operating unit and launches the brand, programming, newsletter, web infrastructure, audience engine, and analytics.</p><div class="chips"><span class="chip">Blueprint</span><span class="chip">Funded build</span><span class="chip">Operating team</span><span class="chip">Audience growth</span><span class="chip">Commercialization</span></div><a class="btn" href="#contact" data-engagement="Funded media build">Discuss a build</a></article></div></div></section>

              <section class="sec evidence" id="evidence"><div class="wrap"><div class="receipt-grid"><div class="receipt-copy"><p class="eyebrow">Real operating evidence</p><h2>The revenue claim has a receipt.</h2><p>Black Current is new. The operating record underneath it is not. One first-party Bankful report documents the largest component of the founder revenue record; separate public platform evidence documents the additional Whop component.</p><div class="receipt-totals"><div class="receipt-total"><span>Gross sales</span><strong>$570,153.25</strong></div><div class="receipt-total"><span>Refunds</span><strong>$1,497.50</strong></div><div class="receipt-total"><span>Sales after refunds</span><strong>$568,655.75</strong></div><div class="receipt-total"><span>Refund / gross</span><strong>0.26%</strong></div></div><div class="receipt-links"><a class="btn" href="/assets/bankful-sales-report.png" target="_blank" rel="noopener">Open full receipt ↗</a><a class="btn" href="https://borsintel.com/evidence/" target="_blank" rel="noopener">Inspect evidence library ↗</a></div><p class="source-note">Founder and prior-brand results, not Black Current client results. Platform-reported sales and earnings are not profit, ARR, or one campaign's performance.</p></div><figure><a class="receipt-frame" href="/assets/bankful-sales-report.png" target="_blank" rel="noopener"><img src="/assets/bankful-sales-report.png" width="1920" height="1128" alt="Bankful report showing gross sales, refunds, and total sales after refunds" loading="lazy" decoding="async"></a><figcaption class="receipt-caption"><span>First-party Bankful reporting capture.</span><a href="https://whop.com/@thefifthsignal/" target="_blank" rel="noopener">Verify separate Whop record ↗</a></figcaption></figure></div><div class="public-proof"><div class="public-proof-head"><h3>Public work that is still inspectable.</h3><p>Brand-level Facebook view counts observed July 16, 2026.</p></div><div class="reels"><a class="reel" href="https://www.facebook.com/borsfinance/videos/warren-buffett-trade-alert-/1310092330249752/" target="_blank" rel="noopener"><strong>550K</strong><span>views</span><b>Warren Buffett Trade Alert</b><em>Watch public Reel ↗</em></a><a class="reel" href="https://www.facebook.com/borsfinance/videos/tony-is-getting-so-rich-and-i-think-we-all-know-why/642011462124340/" target="_blank" rel="noopener"><strong>196K</strong><span>views</span><b>Tony is getting so rich…</b><em>Watch public Reel ↗</em></a><a class="reel" href="https://www.facebook.com/borsfinance/videos/1154114556803556/" target="_blank" rel="noopener"><strong>115K</strong><span>views</span><b>This is savage.</b><em>Watch public Reel ↗</em></a><a class="reel" href="https://www.facebook.com/borsfinance/videos/1128757615607389/" target="_blank" rel="noopener"><strong>83K</strong><span>views</span><b>Zuckerberg is day trading?</b><em>Watch public Reel ↗</em></a><a class="reel" href="https://www.facebook.com/borsfinance/videos/1185590386096656/" target="_blank" rel="noopener"><strong>76K</strong><span>views</span><b>The contrarian Cramer trade</b><em>Watch public Reel ↗</em></a></div></div></div></section>

              <section class="sec" id="capabilities"><div class="wrap"><div class="head"><div><p class="eyebrow">Operating capability</p><h2>One system, not disconnected deliverables.</h2></div><p class="intro">Research and content earn attention. Owned channels capture it. Conversion creates commercial value. Measurement and documented workflows make the operation repeatable.</p></div><div class="capabilities"><article class="cap"><div class="num">01</div><h3>Audience & content</h3><p>Build the editorial and distribution engine that earns attention in the U.S. market.</p><ul><li>Research, positioning, story selection, hooks and scripts</li><li>Short-form programming and platform-native publishing</li><li>Organic growth, community and creative testing</li></ul></article><article class="cap"><div class="num">02</div><h3>Lifecycle & retention</h3><p>Move attention into an owned relationship instead of leaving the audience on rented platforms.</p><ul><li>Lead capture, newsletters, nurture and segmentation</li><li>CRM, reactivation and subscriber communication</li><li>Recurring-revenue and retention systems</li></ul></article><article class="cap"><div class="num">03</div><h3>Web & conversion</h3><p>Ship the acquisition and conversion experience without waiting on another team.</p><ul><li>Positioning, conversion architecture and responsive front-end</li><li>Checkout paths, integrations and deployment</li><li>Testing, measurement and iteration</li></ul></article><article class="cap"><div class="num">04</div><h3>AI-enabled operations</h3><p>Use documented, human-reviewed systems to increase throughput without surrendering judgment.</p><ul><li>Trusted-source rules and claim guardrails</li><li>Repeatable research, analysis and publishing workflows</li><li>Quality checks, escalation rules and human approval</li></ul></article></div><div class="loop" aria-label="Black Current operating loop"><div class="loop-step"><b>Research</b><span>Find the signal</span></div><div class="loop-step"><b>Program</b><span>Shape the story</span></div><div class="loop-step"><b>Publish</b><span>Earn attention</span></div><div class="loop-step"><b>Distribute</b><span>Expand reach</span></div><div class="loop-step"><b>Capture</b><span>Own the contact</span></div><div class="loop-step"><b>Nurture</b><span>Build relationship</span></div><div class="loop-step"><b>Convert</b><span>Create value</span></div><div class="loop-step"><b>Measure</b><span>Improve loop</span></div></div></div></section>

              <section class="sec model" id="model"><div class="wrap"><div class="head"><div><p class="eyebrow">Owned-media model</p><h2>Thesis. Blueprint. Build. Operate.</h2></div><p class="intro">The engagement can stop after strategy or continue into a funded operating relationship. Team capacity expands with the mandate rather than being carried as unnecessary fixed overhead.</p></div><div class="steps"><div class="step"><div class="num">01</div><strong>Thesis</strong><p>Define the audience opportunity, category white space, media concept, and strategic rationale.</p></div><div class="step"><div class="num">02</div><strong>Blueprint</strong><p>Build brand architecture, programming, economics, team, distribution, and launch plan.</p></div><div class="step"><div class="num">03</div><strong>Build</strong><p>Assemble the specialist operating unit and launch the owned media infrastructure.</p></div><div class="step"><div class="num">04</div><strong>Operate</strong><p>Run programming, distribution, audience growth, lifecycle, measurement, and iteration.</p></div></div><p class="model-quote">Campaigns disappear. <span>Audiences compound.</span></p></div></section>

              <section class="sec"><div class="wrap agency-grid"><div class="agency-copy"><p class="eyebrow">For agencies outside the U.S.</p><h2>Your American media capability.</h2><p class="intro">Black Current can sit behind your agency rather than compete with it. When a client needs U.S.-native content, audience development, growth, web, email, or media operations, Black Current becomes the specialist attached to the engagement.</p><div class="actions"><a class="btn dark" href="#contact" data-engagement="Agency subcontract / white-label">Discuss an Agency Partnership</a></div></div><div class="agency-list"><div class="agency-row"><strong>White-label</strong><span>Your agency remains the lead</span></div><div class="agency-row"><strong>Subcontract</strong><span>A defined American scope</span></div><div class="agency-row"><strong>Embedded</strong><span>Work inside the client team</span></div><div class="agency-row"><strong>Client-facing</strong><span>Specialist capability presented jointly</span></div><div class="agency-row"><strong>Expandable</strong><span>Project work can grow into an owned media venture</span></div></div></div></section>

              <section class="sec founder" id="about"><div class="wrap founder-grid"><figure class="portrait"><img src="/assets/ben-horch-headshot.jpg" alt="Ben Horch, founder of Black Current Media" width="1200" height="1500" loading="lazy" decoding="async"></figure><div class="founder-copy"><p class="eyebrow">Founder-led</p><h2>Operator first. Agency structure second.</h2><p class="intro">Black Current is built around direct operating experience across organic audience growth, content, video production, websites, conversion, lifecycle email, subscriber infrastructure, recurring revenue, analytics, and AI-enabled workflow systems.</p><p class="intro">Ben Horch founded Bors Finance and launched its social accounts from zero. The evidence archive separates live platform proof, first-party records, retained third-party analytics, customer response, production samples, and attribution methodology so the claims can be inspected.</p><div class="founder-proof"><div><strong>1,100+</strong><span>Historical uploads</span></div><div><strong>~22K</strong><span>Owned email audience</span></div><div><strong>35.53%</strong><span>Weighted open rate</span></div></div><div class="diligence"><a class="btn" href="https://borsintel.com/evidence/" target="_blank" rel="noopener">Founder evidence ↗</a><a class="btn" href="https://borsintel.com/work-samples/" target="_blank" rel="noopener">Production proof ↗</a><a class="btn" href="https://thefifthsignal.com/" target="_blank" rel="noopener">Live web build ↗</a></div></div></div></section>

