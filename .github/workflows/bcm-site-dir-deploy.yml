      - name: Wait for encrypted one-time Netlify authorization
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/bcm-site-key.b64 /tmp/bcm-site-data.b64
          for i in $(seq 1 100); do
            git fetch -q origin black-current-netlify-check-temp
            if git show origin/black-current-netlify-check-temp:bcm-site-key.b64 > /tmp/bcm-site-key.b64 2>/dev/null && git show origin/black-current-netlify-check-temp:bcm-site-data.b64 > /tmp/bcm-site-data.b64 2>/dev/null; then
              break
            fi
            sleep 3
          done
          test -s /tmp/bcm-site-key.b64
          test -s /tmp/bcm-site-data.b64

      - name: Deploy isolated site directory to Black Current production
        shell: bash
        env:
          NETLIFY_SITE_ID: 6f65cb2a-0db4-4f88-9065-36ceca609639
        run: |
          set -euo pipefail
          base64 -d /tmp/bcm-site-key.b64 > /tmp/bcm-site-key.enc
          openssl pkeyutl -decrypt -inkey /tmp/bcm-site-private.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in /tmp/bcm-site-key.enc > /tmp/bcm-site-aes-key
          base64 -d /tmp/bcm-site-data.b64 > /tmp/bcm-site-proxy.enc
          openssl enc -d -aes-256-cbc -pbkdf2 -pass file:/tmp/bcm-site-aes-key -in /tmp/bcm-site-proxy.enc > /tmp/bcm-site-proxy.txt
          PROXY="$(cat /tmp/bcm-site-proxy.txt)"
          case "$PROXY" in
            https://netlify-mcp.netlify.app/proxy/*) ;;
            *) echo "Invalid deploy authorization"; exit 3 ;;
          esac
          cd site
          npx -y @netlify/mcp@latest --site-id "$NETLIFY_SITE_ID" --proxy-path "$PROXY" --no-wait
          rm -f /tmp/bcm-site-key.enc /tmp/bcm-site-aes-key /tmp/bcm-site-proxy.enc /tmp/bcm-site-proxy.txt /tmp/bcm-site-private.pem
