            <main id="top">
              <section class="hero"><div class="wrap hero-grid"><div><p class="eyebrow">U.S. media and audience operations for global organizations</p><h1>Build an American audience you own.</h1><p class="lead">Black Current helps organizations outside the United States build, operate, and scale U.S.-facing media systems. We can join an existing engagement, own a defined growth scope, or build the audience asset from zero.</p><div class="actions"><a class="btn dark" href="#contact" data-engagement="U.S. media / growth partner">Start a Project</a><a class="btn ghost" href="#evidence">Inspect the Evidence</a></div><p class="micro">Founder-led in the United States. Specialist teams expand around funded scope.</p></div><aside class="hero-panel"><p class="eyebrow">What Black Current can own</p><h2>The entire path from attention to owned audience.</h2><p>A single operating layer across media, growth, owned distribution, conversion, and measurement.</p><div class="panel-row"><strong>Audience</strong><span>Strategy · Organic growth · Distribution</span></div><div class="panel-row"><strong>Content</strong><span>Research · Programming · Short-form</span></div><div class="panel-row"><strong>Owned channels</strong><span>Web · Email · Subscriber systems</span></div><div class="panel-row"><strong>Conversion</strong><span>Offers · Landing pages · Checkout paths</span></div><div class="panel-row"><strong>Operations</strong><span>Analytics · Workflow · Optimization</span></div></aside></div></section>

