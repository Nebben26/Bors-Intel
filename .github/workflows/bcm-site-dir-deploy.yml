            <script>
              (()=>{
                const form=document.getElementById('project-form');
                const engagement=document.getElementById('engagement');
                const status=document.getElementById('form-status');
                const success=document.getElementById('form-success');
                const button=document.getElementById('submit-button');
                document.querySelectorAll('[data-engagement]').forEach(link=>{
                  link.addEventListener('click',()=>{
                    const value=link.getAttribute('data-engagement');
                    if(value && [...engagement.options].some(o=>o.value===value||o.text===value)) engagement.value=value;
                  });
                });
                const encode=data=>new URLSearchParams([...data.entries()]).toString();
                form.addEventListener('submit',async event=>{
                  if(!form.reportValidity()) return;
                  event.preventDefault();
                  button.disabled=true;
                  button.textContent='Sending…';
                  status.textContent='Sending your project details…';
                  try{
                    const response=await fetch('/',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:encode(new FormData(form))});
                    if(!response.ok) throw new Error('Submission failed');
                    form.classList.add('hide');
                    success.setAttribute('aria-hidden','false');
                    status.textContent='';
                    success.focus?.();
                  }catch(error){
                    status.textContent='Secure form handoff failed. Continuing to the standard submission page…';
                    setTimeout(()=>HTMLFormElement.prototype.submit.call(form),250);
                  }finally{
                    button.disabled=false;
                    button.textContent='Send Project Inquiry';
                  }
                });
              })();
            </script>
