name: Black Current Isolated Site Deploy

on:
  push:
    branches:
      - black-current-netlify-check-temp
    paths:
      - .github/workflows/bcm-site-dir-deploy.yml

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout temporary deploy branch
        uses: actions/checkout@v4
        with:
          ref: black-current-netlify-check-temp
          fetch-depth: 0

      - name: Create ephemeral deployment key
        shell: bash
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/bcm-site-private.pem >/dev/null 2>&1
          openssl rsa -pubout -in /tmp/bcm-site-private.pem -out bcm-site-public.pem >/dev/null 2>&1
          git config user.name "black-current-deploy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add bcm-site-public.pem
          git commit -m "Publish Black Current isolated deploy key"
          git push origin HEAD:black-current-netlify-check-temp

      - name: Build Black Current production site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site/assets site/thanks

          curl -fsSL "https://raw.githubusercontent.com/Nebben26/Bors-Intel/main/assets/bankful-sales-report.png" -o site/assets/bankful-sales-report.png
          curl -fsSL "https://raw.githubusercontent.com/Nebben26/Bors-Intel/main/assets/ben-horch-headshot.jpg" -o site/assets/ben-horch-headshot.jpg

          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta name="theme-color" content="#0b1b2c">
            <title>Black Current Media | U.S. Media & Audience Operations</title>
            <meta name="description" content="Black Current Media helps global organizations and agencies build, operate, and scale U.S.-facing media, audience, content, email, web, and growth systems.">
            <meta property="og:title" content="Black Current Media | Build an American audience you own">
            <meta property="og:description" content="U.S. media, audience, growth, web, email, and operating capability for global organizations.">
            <meta property="og:type" content="website">
            <meta property="og:url" content="https://blackcurrentmedia.com/">
            <meta property="og:image" content="https://blackcurrentmedia.com/assets/bankful-sales-report.png">
            <link rel="canonical" href="https://blackcurrentmedia.com/">
            <link rel="icon" href="/black-current-favicon.svg?v=4" type="image/svg+xml" sizes="any">
            <link rel="shortcut icon" href="/black-current-favicon.svg?v=4" type="image/svg+xml">
