              <section class="hero"><div class="wrap hero-grid"><div><div class="k">U.S. media, audience & growth operations for global organizations</div><h1>Build an American audience you own.</h1><p class="lead">Black Current helps global organizations and agencies build, operate, and scale U.S.-facing media systems. We can join an existing engagement, own a defined growth scope, or build an audience asset from zero.</p><div class="actions"><a class="btn dark" href="#contact">Discuss a Project</a><a class="btn light" href="#evidence">Inspect the Evidence</a></div><p class="micro">Founder-led in the United States. Expandable specialist teams are assembled around funded scope.</p></div><aside class="panel"><div class="k">What Black Current can own</div><h2>The entire path from attention to owned audience.</h2><p>For agencies, companies, media groups, investment organizations, airlines, tourism groups, industrial organizations, and institutions that need U.S.-native execution.</p><div class="rows"><div class="row"><b>Audience</b><span>Strategy · Organic growth · Distribution</span></div><div class="row"><b>Content</b><span>Research · Programming · Short-form</span></div><div class="row"><b>Owned channels</b><span>Web · Email · Subscriber systems</span></div><div class="row"><b>Conversion</b><span>Landing pages · Offers · Checkout paths</span></div><div class="row"><b>Operations</b><span>Analytics · Workflow · Optimization</span></div></div></aside></div></section>

