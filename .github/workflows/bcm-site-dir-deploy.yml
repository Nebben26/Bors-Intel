              <section class="sec" id="work"><div class="wrap"><div class="head"><div><div class="k">Three ways to engage</div><h2>Useful before the giant mandate exists.</h2></div><p class="intro">Black Current is designed to start with the smallest commercially useful scope and expand when the work proves itself. A buyer does not need to begin with a six-figure media build.</p></div><div class="three"><article class="offer"><div class="num">01 · FASTEST ENGAGEMENT</div><h3>U.S. Media Partner</h3><p>For agencies and international organizations that need an American operator inside active work. Black Current can work white-label, as a subcontractor, embedded, or client-facing.</p><div class="chips"><span class="chip">Content strategy</span><span class="chip">Organic growth</span><span class="chip">Short-form</span><span class="chip">Web & conversion</span><span class="chip">Email & lifecycle</span><span class="chip">U.S. localization</span></div></article><article class="offer"><div class="num">02 · STRATEGY ENTRY</div><h3>Audience Asset Thesis</h3><p>A focused strategic engagement defining the American audience opportunity, category white space, media concept, programming, distribution, economics, and what should be built next.</p><div class="chips"><span class="chip">Opportunity map</span><span class="chip">Media concept</span><span class="chip">Programming slate</span><span class="chip">Distribution model</span><span class="chip">12-month operating thesis</span></div></article><article class="offer"><div class="num">03 · OWNED MEDIA</div><h3>Build + Operate</h3><p>For organizations ready to own the asset. Black Current can assemble the operating unit and launch the brand, programming, newsletter, web infrastructure, audience engine, analytics, and ongoing growth operation.</p><div class="chips"><span class="chip">Blueprint</span><span class="chip">Funded build</span><span class="chip">Operating team</span><span class="chip">Audience growth</span><span class="chip">Commercialization</span></div></article></div></div></section>

              <section class="sec" id="capabilities"><div class="wrap"><div class="head"><div><div class="k">Operating capability</div><h2>One system, not disconnected deliverables.</h2></div><p class="intro">The founder operating record covers the complete loop: research and content create attention; owned channels capture it; conversion turns it into commercial value; reporting and workflow systems make the operation repeatable.</p></div><div class="capgrid"><article class="cap"><div class="num">01</div><h3>Audience & content</h3><p>Build the editorial and distribution engine that earns attention in the U.S. market.</p><ul><li>Research, positioning, story selection, hooks and scripts</li><li>Short-form programming and platform-native publishing</li><li>Organic growth, community and creative testing</li></ul></article><article class="cap"><div class="num">02</div><h3>Lifecycle & retention</h3><p>Move attention into an owned relationship instead of leaving the audience on rented platforms.</p><ul><li>Lead capture, newsletters, nurture and segmentation</li><li>CRM, reactivation and subscriber communication</li><li>Recurring-revenue and retention systems</li></ul></article><article class="cap"><div class="num">03</div><h3>Web & conversion</h3><p>Ship the acquisition and conversion experience without waiting on another team.</p><ul><li>Positioning, conversion architecture and responsive front-end</li><li>Checkout paths, integrations and deployment</li><li>Testing, measurement and ongoing iteration</li></ul></article><article class="cap"><div class="num">04</div><h3>Measurement & operations</h3><p>Turn the operation into something a team can run, inspect and improve.</p><ul><li>Dashboards, KPIs and campaign analysis</li><li>Customer feedback and funnel diagnostics</li><li>Documented workflows, QA and next-step recommendations</li></ul></article></div><div class="loop"><div><b>Research</b><span>Find the signal</span></div><div><b>Program</b><span>Shape the story</span></div><div><b>Publish</b><span>Earn attention</span></div><div><b>Distribute</b><span>Expand reach</span></div><div><b>Capture</b><span>Own the contact</span></div><div><b>Nurture</b><span>Build the relationship</span></div><div><b>Convert</b><span>Create value</span></div><div><b>Measure</b><span>Improve the loop</span></div></div></div></section>

              <section class="sec proof" id="evidence"><div class="wrap"><div class="head"><div><div class="k">Founder operating evidence</div><h2>Proof before adjectives.</h2></div><p class="intro">Black Current is new. The operating system underneath it is not. The figures below describe founder Ben Horch's prior brand-level and first-party operating record, including Bors Finance and The Fifth Signal.</p></div><div class="stats"><div class="stat"><strong>$775K+</strong><span>Conservative shorthand for non-overlapping Bankful and Whop platform records exceeding $778K combined.</span></div><div class="stat"><strong>0 → 62K+</strong><span>Facebook page likes built organically from the first follower.</span></div><div class="stat"><strong>~10.7M</strong><span>Historical brand video views retained by an independent analytics provider.</span></div><div class="stat"><strong>43.8K</strong><span>Historical peak subscribers on the discontinued Bors video channel.</span></div><div class="stat"><strong>~22K</strong><span>Owned email audience reactivated and operated through first-party lifecycle campaigns.</span></div><div class="stat"><strong>45.1%</strong><span>Latest recorded open rate: 9,876 unique opens across 21,893 delivered emails.</span></div></div><div class="prooflinks"><div class="prooflink"><b>Public performance</b><p>Five surviving Bors Finance Reels range from 76K to 550K views, with a 550K-view top public example.</p><a href="https://borsintel.com/work-samples/" target="_blank" rel="noopener">Inspect public content proof ↗</a></div><div class="prooflink"><b>Revenue & customer proof</b><p>Bankful reports $570,153.25 gross sales and $568,655.75 after refunds. Whop separately displays $210K+ earned.</p><a href="https://borsintel.com/evidence/" target="_blank" rel="noopener">Open the evidence library ↗</a></div><div class="prooflink"><b>Email operating record</b><p>112,144 delivered emails, 39,847 unique opens, and a 35.53% weighted open rate across five measured campaigns.</p><a href="https://borsintel.com/evidence/#email" target="_blank" rel="noopener">Inspect lifecycle evidence ↗</a></div></div><p class="note">These are founder and prior-brand results, not Black Current client results. Source type, attribution, caveats, first-party records, public-platform evidence, and independent analytics are documented in the linked Bors Intel evidence library. Additional records can be reviewed during commercial diligence.</p></div></section>

              <section class="sec caseband"><div class="wrap casegrid"><div><div class="k">Operating case</div><h2>From blank accounts to a functioning media business.</h2><p class="bigquote">Bors Finance was not one successful post. It required research, content production, publishing, community, email, conversion, subscriptions, customer experience, analytics, and thousands of repetitions across the system.</p><div class="actions" style="margin-top:25px"><a class="btn dark" href="https://borsintel.com/evidence/" target="_blank" rel="noopener">View the operating evidence</a><a class="btn light" href="https://borsintel.com/work-samples/" target="_blank" rel="noopener">View production samples</a></div></div><div class="factbox"><div class="fact"><b>Audience</b><span>0 → 62K+ Facebook likes</span></div><div class="fact"><b>Video operation</b><span>43.8K peak subscribers · ~10.7M views</span></div><div class="fact"><b>Production depth</b><span>1,100+ historical uploads</span></div><div class="fact"><b>Top surviving Reel</b><span>550K public views</span></div><div class="fact"><b>Email</b><span>35.53% weighted open rate across five campaigns</span></div><div class="fact"><b>Revenue record</b><span>$775K+ conservative platform-record shorthand</span></div></div></div></section>

              <section class="sec" id="systems"><div class="wrap systems"><div><div class="k">AI-enabled media operations</div><h2 style="font-size:clamp(32px,4vw,50px);line-height:1.02;letter-spacing:-.045em;margin:0 0 17px">Scale the work without surrendering judgment.</h2><p class="intro">Black Current uses documented, human-reviewed workflows for research, publishing, analysis, and team execution. The value is not a clever prompt. It is context, trusted-source rules, repeatable instructions, quality controls, escalation procedures, and final human approval.</p><div class="controlgrid"><div class="control">Role context</div><div class="control">Trusted sources</div><div class="control">Claim guardrails</div><div class="control">Quality checks</div><div class="control">Escalation rules</div><div class="control">Human approval</div></div><div class="actions" style="margin-top:22px"><a class="btn light" href="https://borsintel.com/ai-systems/" target="_blank" rel="noopener">Inspect workflow systems ↗</a></div></div><div class="systemcards"><div class="system"><b>Research → publishing</b><p>Verified-source workflows for high-risk finance and public-record content, including source hierarchy, story scoring, claim controls and final sign-off.</p></div><div class="system"><b>Parallel investigation</b><p>Role-specific research workspaces designed to divide large questions, reconcile conflicting claims, score relevance, and produce decision-ready work. One operating record includes six long-form investigations totaling 241 pages.</p></div><div class="system"><b>Analysis → decisions</b><p>Structured analysis of campaign data, audience performance, customer feedback, offers and funnels, with cross-model critique and human review of math, claims and conclusions.</p></div><div class="system"><b>Document → train</b><p>Working systems can be converted into operator playbooks with setup, source rules, examples, prohibited claims, QA checklists, escalation triggers and adoption measurement.</p></div></div></div></section>

              <section class="sec" id="model"><div class="wrap"><div class="head"><div><div class="k">Owned-media model</div><h2>Thesis. Blueprint. Build. Operate.</h2></div><p class="intro">The engagement can stop after strategy or continue into a funded operating relationship. Black Current expands team capacity with the mandate rather than carrying unnecessary overhead before a project exists.</p></div><div class="steps"><div class="step"><div class="num">01</div><strong>Thesis</strong><p>Define the audience opportunity, category white space, media concept and strategic rationale.</p></div><div class="step"><div class="num">02</div><strong>Blueprint</strong><p>Build the brand architecture, programming, economics, team, distribution and launch plan.</p></div><div class="step"><div class="num">03</div><strong>Build</strong><p>Assemble the specialist operating unit and launch the owned media infrastructure.</p></div><div class="step"><div class="num">04</div><strong>Operate</strong><p>Run programming, distribution, audience growth, lifecycle, measurement and iteration.</p></div></div></div></section>

              <section class="sec agency"><div class="wrap"><div class="head"><div><div class="k">Where Black Current fits</div><h2>Clear scopes for international buyers.</h2></div><p class="intro">The work is especially useful when an organization understands the importance of the U.S. market but does not want to build every American media capability internally.</p></div><div class="usegrid"><div class="use"><b>Gulf agency → U.S. specialist</b><p>An established regional agency needs American audience, content, growth, web, email, or media capability behind a client engagement.</p></div><div class="use"><b>Global brand → U.S. audience</b><p>An overseas organization needs a U.S.-native content and distribution operation rather than generic localization.</p></div><div class="use"><b>Institution → owned media</b><p>An organization wants an American-facing media property that compounds instead of another temporary campaign.</p></div><div class="use"><b>Media group → new vertical</b><p>A media owner wants to test and launch a new audience category with a lean operating unit.</p></div><div class="use"><b>Company → growth loop</b><p>A business has attention but needs the web, email, conversion and lifecycle system that turns it into owned value.</p></div><div class="use"><b>Team → operating system</b><p>A content or research team needs documented AI-enabled workflows, quality controls and repeatable execution.</p></div></div></div></section>

              <section class="sec"><div class="wrap agency-grid"><div><div class="k">For agencies outside the U.S.</div><h2 style="font-size:clamp(32px,4vw,50px);line-height:1.02;letter-spacing:-.045em;margin:0 0 17px">Your American media capability.</h2><p class="intro">Black Current can sit behind your agency rather than compete with it. When a client needs U.S.-native content, audience development, growth, web, email, or media operations, Black Current can become the specialist attached to the engagement.</p><div class="actions" style="margin-top:25px"><a class="btn dark" href="#contact">Discuss an Agency Partnership</a></div></div><div class="list"><div><b>White-label</b><span>Your agency remains the lead</span></div><div><b>Subcontract</b><span>A defined American scope</span></div><div><b>Embedded</b><span>Work inside the client team</span></div><div><b>Client-facing</b><span>Specialist capability presented jointly</span></div><div><b>Expandable</b><span>Project work can grow into an owned media venture</span></div></div></div></section>

              <section class="sec" id="about"><div class="wrap founder"><div><div class="k">Founder-led</div><h2>Operator first. Agency structure second.</h2></div><div class="card"><strong>Ben Horch · Founder / Operator</strong><p>Black Current is built around direct operating experience across organic audience growth, content, video production, websites, conversion, lifecycle email, subscriber infrastructure, recurring revenue, analytics, and AI-enabled workflow systems.</p><p>Ben founded Bors Finance and launched its social accounts from zero. The founder evidence archive separates live platform proof, first-party records, retained third-party analytics, customer response, production samples, and attribution methodology so commercial claims can be inspected rather than simply repeated.</p><p>For larger engagements, Black Current assembles and manages the specialist operating unit required by the scope.</p><div class="diligence"><a class="btn light" href="https://borsintel.com/evidence/" target="_blank" rel="noopener">Founder evidence ↗</a><a class="btn light" href="https://borsintel.com/work-samples/" target="_blank" rel="noopener">Production proof ↗</a><a class="btn light" href="https://thefifthsignal.com/" target="_blank" rel="noopener">Live web build ↗</a></div></div></div></section>

