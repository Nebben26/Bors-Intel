name: Black Current Isolated Site Deploy

on:
  push:
    branches:
      - black-current-netlify-check-temp
    paths:
      - .github/workflows/bcm-site-dir-deploy.yml

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout temporary deploy branch
        uses: actions/checkout@v4
        with:
          ref: black-current-netlify-check-temp
          fetch-depth: 0

      - name: Create ephemeral deployment key
        shell: bash
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/bcm-site-private.pem >/dev/null 2>&1
          openssl rsa -pubout -in /tmp/bcm-site-private.pem -out bcm-site-public.pem >/dev/null 2>&1
          git config user.name "black-current-deploy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add bcm-site-public.pem
          git commit -m "Publish Black Current isolated deploy key"
          git push origin HEAD:black-current-netlify-check-temp

      - name: Recover approved Black Current production page
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/black-current-secure-deploy.yml').read_text()
          start = "          cat > site/index.html <<'HTML'\n"
          end = "\n          HTML\n"
          if start not in src or end not in src:
              raise SystemExit('Approved Black Current build marker missing')
          html = src.split(start, 1)[1].split(end, 1)[0]
          html = '\n'.join(line[10:] if line.startswith('          ') else line for line in html.splitlines()) + '\n'
          needle = '<meta name="viewport" content="width=device-width,initial-scale=1">'
          favicon = '<link rel="icon" href="/black-current-favicon.svg?v=2" type="image/svg+xml" sizes="any"><link rel="shortcut icon" href="/black-current-favicon.svg?v=2" type="image/svg+xml">'
          if needle not in html:
              raise SystemExit('Head marker missing')
          html = html.replace(needle, needle + favicon, 1)
          Path('site/index.html').write_text(html)
          PY
          cat > site/black-current-favicon.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
            <rect width="64" height="64" rx="12" fill="#0b1b2c"/>
            <g fill="#ffffff">
              <rect x="10" y="13" width="44" height="8" rx="1"/>
              <path d="M10 27h16c5.5 0 8.5-6 14-6h14v8H41c-5.5 0-8.5 6-15 6H10z"/>
              <rect x="10" y="43" width="44" height="8" rx="1"/>
            </g>
          </svg>
          SVG
          cat > site/_headers <<'HEADERS'
          /*
            X-Frame-Options: DENY
            X-Content-Type-Options: nosniff
            Referrer-Policy: strict-origin-when-cross-origin
            Permissions-Policy: camera=(), microphone=(), geolocation=()
          /black-current-favicon.svg
            Cache-Control: public, max-age=604800
          HEADERS
          test -s site/index.html
          test -s site/black-current-favicon.svg
          grep -q "Build an American audience you own" site/index.html
          grep -q 'black-current-favicon.svg?v=2' site/index.html
          grep -q 'data-netlify="true"' site/index.html

      - name: Wait for encrypted one-time Netlify authorization
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/bcm-site-key.b64 /tmp/bcm-site-data.b64
          for i in $(seq 1 100); do
            git fetch -q origin black-current-netlify-check-temp
            if git show origin/black-current-netlify-check-temp:bcm-site-key.b64 > /tmp/bcm-site-key.b64 2>/dev/null && git show origin/black-current-netlify-check-temp:bcm-site-data.b64 > /tmp/bcm-site-data.b64 2>/dev/null; then
              break
            fi
            sleep 3
          done
          test -s /tmp/bcm-site-key.b64
          test -s /tmp/bcm-site-data.b64

      - name: Deploy isolated site directory to Black Current production
        shell: bash
        env:
          NETLIFY_SITE_ID: 6f65cb2a-0db4-4f88-9065-36ceca609639
        run: |
          set -euo pipefail
          base64 -d /tmp/bcm-site-key.b64 > /tmp/bcm-site-key.enc
          openssl pkeyutl -decrypt -inkey /tmp/bcm-site-private.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in /tmp/bcm-site-key.enc > /tmp/bcm-site-aes-key
          base64 -d /tmp/bcm-site-data.b64 > /tmp/bcm-site-proxy.enc
          openssl enc -d -aes-256-cbc -pbkdf2 -pass file:/tmp/bcm-site-aes-key -in /tmp/bcm-site-proxy.enc > /tmp/bcm-site-proxy.txt
          PROXY="$(cat /tmp/bcm-site-proxy.txt)"
          case "$PROXY" in
            https://netlify-mcp.netlify.app/proxy/*) ;;
            *) echo "Invalid deploy authorization"; exit 3 ;;
          esac
          cd site
          npx -y @netlify/mcp@latest --site-id "$NETLIFY_SITE_ID" --proxy-path "$PROXY" --no-wait
          rm -f /tmp/bcm-site-key.enc /tmp/bcm-site-aes-key /tmp/bcm-site-proxy.enc /tmp/bcm-site-proxy.txt /tmp/bcm-site-private.pem
